<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Static Website</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>My Static Website</h1>
        <nav>
            <a href="#home">Home</a>
            <a href="#about">About</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <main>
        <section id="home">
            <h2>Welcome</h2>
            <p>This is a simple static website using HTML, CSS and JavaScript.</p>
            <button id="welcomeButton">Click Me</button>
            <p id="message"></p>
        </section>

        <section id="about">
            <h2>About</h2>
            <p>This website does not require a backend or database. It runs directly in the browser.</p>
        </section>

        <section id="contact">
            <h2>Contact</h2>
            <form id="contactForm">
                <input type="text" id="name" placeholder="Enter your name" required>
                <input type="email" id="email" placeholder="Enter your email" required>
                <button type="submit">Submit</button>
            </form>
            <p id="formMessage"></p>
        </section>
    </main>

    <footer>
        <p>© 2026 My Static Website</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
